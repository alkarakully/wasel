services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wasel
      POSTGRES_USER: wasel
      POSTGRES_PASSWORD: wasel
    ports:
      - "${WASEL_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasel -d wasel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: ./backend
    # The image runs as an unprivileged user; in development root can write
    # into the mounted source folder.
    user: root
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgis://wasel:wasel@db:5432/wasel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_DEBUG: "1"
      # Development only: phones on the same Wi-Fi reach the API at the Mac's address.
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "${WASEL_WEB_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs background jobs and, with -B, the periodic schedule. In production
  # run beat as its own single process instead.
  worker:
    build: ./backend
    user: root
    command: celery -A wasel worker -B -l info
    environment:
      DATABASE_URL: postgis://wasel:wasel@db:5432/wasel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_DEBUG: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
